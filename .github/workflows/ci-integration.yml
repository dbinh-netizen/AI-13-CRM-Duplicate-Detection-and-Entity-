name: W05 Integration & Test CI

on:
  push:
    branches: ["main", "develop", "feat/**", "chore/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  verify-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password_test
          POSTGRES_DB: songnhat_crm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crm_user -d songnhat_crm_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run test suite
        env:
          APP_ENV: integration
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password_test
          POSTGRES_DB: songnhat_crm_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DATABASE_URL: postgresql://crm_user:crm_password_test@localhost:5432/songnhat_crm_db
          SECRET_KEY: ci_test_secret_key_only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 480
          MAX_ROWS_PER_FILE: 5000
          CANDIDATE_CEILING: 200000
          SUSPECTED_THRESHOLD: 65.0
          HIGH_CONFIDENCE_THRESHOLD: 85.0
        run: |
          pytest -v
